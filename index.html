<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        /* Tap to Start Screen */
        .start-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .start-screen button {
            padding: 15px 30px;
            font-size: 18px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Typewriter Effect */
        .message-container {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid white;
            width: 0;
            animation: typing 5s steps(40, end) forwards, blink 0.8s infinite;
            display: none;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        /* Heart Animation */
        .heart {
            position: absolute;
            color: red;
            font-size: 20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Flashing Background */
        .flash {
            animation: flash 0.5s alternate infinite;
        }

        @keyframes flash {
            0% { background: black; }
            100% { background: red; }
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            display: none;
            text-align: center;
        }

        .popup button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .yes-btn {
            background: green;
            color: white;
        }

        .no-btn {
            background: red;
            color: white;
        }

    </style>
</head>
<body>

    <!-- Tap to Start Screen -->
    <div class="start-screen" id="startScreen">
        <h1>❤️ Tap to Begin ❤️</h1>
        <button onclick="startExperience()">Start</button>
    </div>

    <audio id="romanticMusic" loop>
        <source src="your-romantic-song.mp3" type="audio/mp3">
    </audio>

    <div class="message-container" id="message">
        YOO what's up SHAWTY!! lol Anyways i love you to the moon and back and all that sentimental stuff..
    </div>

    <div class="popup" id="popup">
        <h2>Will You Be My Valentine? ❤️</h2>
        <button class="yes-btn" onclick="acceptProposal()">Yes!</button>
        <button class="no-btn" onclick="rejectProposal()">No</button>
    </div>

    <script>
        function startExperience() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("romanticMusic").play();
            startFallingHearts();
            setTimeout(() => {
                document.getElementById("message").style.display = "block";
                setTimeout(() => {
                    document.body.classList.add("flash");
                    setTimeout(() => {
                        document.getElementById("popup").style.display = "block";
                        document.body.classList.remove("flash");
                    }, 3000);
                }, 6000);
            }, 1000);
        }

        function startFallingHearts() {
            setInterval(() => {
                let heart = document.createElement("div");
                heart.innerHTML = "❤️";
                heart.classList.add("heart");
                heart.style.left = Math.random() * window.innerWidth + "px";
                heart.style.top = "-20px";
                heart.style.fontSize = Math.random() * 30 + 10 + "px";
                heart.style.animationDuration = Math.random() * 3 + 2 + "s";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 300);
        }

        function acceptProposal() {
            let proposalMessage = "yeahh you better not click no welcome to death row! ❤️"; // Change this text
            document.getElementById("popup").innerHTML = `<h2>${proposalMessage}</h2>`;
        }

        function rejectProposal() {
            let btn = document.querySelector(".no-btn");
            btn.style.position = "absolute";
            btn.style.left = Math.random() * 80 + "vw";
            btn.style.top = Math.random() * 80 + "vh";
        }
    </script>


</body>
</html>
