<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        /* Make elements responsive */
        h1, h2, button {
            font-size: calc(1rem + 1vw);
        }

        /* Tap to Start Screen */
        .start-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 10px;
        }

        .start-screen button {
            padding: 10px 5vw;
            font-size: 1.2em;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Typewriter Effect */
        .message-container {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: calc(1rem + 0.5vw);
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid white;
            width: 0;
            animation: typing 5s steps(40, end) forwards, blink 0.8s infinite;
            display: none;
            max-width: 90%;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        /* Popup */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .popup button {
            margin: 10px;
            padding: 10px 5vw;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            width: 40%;
            max-width: 150px;
        }

        .yes-btn {
            background: green;
            color: white;
        }

        .no-btn {
            background: red;
            color: white;
        }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <h1>❤️ Tap to Begin ❤️</h1>
        <button onclick="startExperience()">Start</button>
    </div>

    <div class="message-container" id="message">
        YOO what's up SHAWTY!! lol Anyways I love you to the moon and back and all that sentimental stuff..
    </div>

    <div class="popup" id="popup">
        <h2>Will You Be My Valentine? ❤️</h2>
        <button class="yes-btn" onclick="acceptProposal()">Yes!</button>
        <button class="no-btn" onclick="rejectProposal()">No</button>
    </div>

    <script>
        function startExperience() {
            document.getElementById("startScreen").style.display = "none";
            setTimeout(() => {
                document.getElementById("message").style.display = "block";
                setTimeout(() => {
                    document.getElementById("popup").style.display = "block";
                }, 5000);
            }, 2000);
        }

        function acceptProposal() {
            document.getElementById("popup").style.display = "none";
        }

        function rejectProposal() {
            let btn = document.querySelector(".no-btn");
            btn.style.position = "absolute";
            btn.style.left = Math.random() * 80 + "vw";
            btn.style.top = Math.random() * 80 + "vh";
        }
    </script>
</body>
</html>
